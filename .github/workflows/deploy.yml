name: Deploy site

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "_sass/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # A separate job, so a formatting slip fails the check without blocking the deploy.
  prettier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Node 🟩
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install 📦
        run: npm ci
      - name: Check formatting 💅
        run: npx prettier --check .
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          # jekyll-last-modified-at reads commit dates to build sitemap <lastmod>;
          # a shallow clone has none and silently falls back to checkout time.
          fetch-depth: 0
      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Build 🔧
        run: |
          export JEKYLL_ENV=production
          bundle exec jekyll build
      - name: Deploy 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
